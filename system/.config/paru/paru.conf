# Keep the system defaults (/etc/paru.conf), then layer overrides on top.
Include = /etc/paru.conf

[bin]
# Second opinion on PKGBUILD reviews: grep + AUR metadata + claude -p.
# paru waits for it to exit before asking "Accept changes?". See the script header.
Pager = $HOME/.local/bin/custom/aur-review.sh
