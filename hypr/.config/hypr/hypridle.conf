#
# Version 2.8.3
# DO NOT REMOVE THE REPLACEMENT COMMENTS
# REQUIRED BY THE ML4W SETTINGS APP
# https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

# general {
#     ignore_dbus_inhibit = false
# }

general {
    # `pidof hyprlock || hyprlock` silently does nothing when a crashed hyprlock
    # is still alive but no longer holding the lock, so the idle timeout blanks
    # the screen without locking it. The helper clears a stale client first.
    lock_cmd = ~/.local/bin/custom/hypr-session.sh lock
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    # Forces the display on. The previous `hl.dsp.dpms(true)` read as TOGGLE,
    # because dpms takes its action from a table field and any non-table
    # argument falls through to toggle - so on resume it could blank the
    # display that had just come back.
    after_sleep_cmd = ~/.local/bin/custom/hypr-session.sh wake
}

# Screenlock
listener {
    # HYPRLOCK TIMEOUT
    timeout = 600
    # HYPRLOCK ONTIMEOUT
    on-timeout = loginctl lock-session
}

# dpms listener removed: hyprctl dispatch dpms off/on while hyprlock is active is a known
# AMD+Hyprland crash/freeze trigger (see hyprwm/hyprlock#953) - let hyprlock's own idle
# behavior and after_sleep_cmd handle the display instead.

# Suspend
listener {
    # SUSPEND TIMEOUT
    timeout = 1800
    #SUSPEND ONTIMEOUT
    on-timeout = systemctl suspend
}
