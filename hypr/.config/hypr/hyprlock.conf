#
# Minimal, static layout: no background/profile images and no dynamic
# labels, so nothing here goes through Hyprland's async resource gatherer
# (see hyprwm/hyprlock#1071 - a resume-timing race in that exact codepath
# was the actual cause of the post-suspend freezes).

source = ~/.local/share/matugen/hyprland-colors.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $surface
}

label {
    monitor =
    text = $USER@james-laptop
    color = $primary
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    rounding = 0
    outline_thickness = 2
    outer_color = $outline
    inner_color = $surface_container
    font_color = $on_surface
    font_family = JetBrainsMono Nerd Font
    placeholder_text = password:
    hide_input = false
    dots_center = true
    check_color = $primary
    fail_color = $error
    fail_text = <i>$FAIL</i>
    fail_transition = 300
    position = 0, -20
    halign = center
    valign = center
}
